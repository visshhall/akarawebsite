<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TBCH7JXTE9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Three separate Google tag IDs, all genuinely in active use (owner
      // confirmed), configured together rather than as three separate
      // script includes — loading gtag.js three times would triple the
      // cost for zero benefit; a single load can drive multiple configs.
      gtag('config', 'G-TBCH7JXTE9');
      gtag('config', 'GT-TQS95GN4');
      gtag('config', 'GT-5MXXFXXN');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ĀKĀRA — Artifacts for Modern Spaces</title>
    <meta name="description" content="Luxury 3D-printed home décor — planters, vases, and lighting, handcrafted to order in Mumbai by Atelier ĀKĀRA." />
    <!--
      This static description/OG content is a fallback for crawlers or link
      previews that don't execute JavaScript. AkaraApp.jsx overwrites these
      tags dynamically per-page once React mounts (see the meta-tag effect
      in AkaraAppRoot) — this file's job is just to have something sane
      present before that happens.
    -->
    <meta property="og:title" content="ĀKĀRA — Artifacts for Modern Spaces" />
    <meta property="og:description" content="Luxury 3D-printed home décor — planters, vases, and lighting, handcrafted to order in Mumbai by Atelier ĀKĀRA." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ĀKĀRA" />
    <!--
      Favicon — a generated brand monogram (bold serif "A" with the same
      gold macron treatment used site-wide), built specifically for
      legibility at real favicon sizes rather than a shrunk copy of the
      display typeface, which loses all definition at 16px.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Razorpay's checkout widget script used to be loaded here
      unconditionally on every page — found during a live-site bug sweep:
      that meant Razorpay's full SDK (60+ separate JS chunk files) was
      downloading for every visitor to every page, including the
      homepage, About, FAQ — everyone, not just the small fraction who
      actually reach checkout. Now loaded dynamically, only at the moment
      someone actually starts checkout (see loadRazorpayScript() in
      AkaraApp.jsx) — the one-time delay that adds to reaching the
      payment step is a far better trade than paying that cost on every
      single page view for every visitor.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
